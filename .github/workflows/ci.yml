name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/
      - run: ruff format --check src/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q --tb=short
      - run: python -m ruff check src/

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: >-
          python -c "import importlib.metadata as metadata, pathlib, pptx_designer;
          assert metadata.version('pptx-designer') == '1.0.0b9';
          assert 'site-packages' in pathlib.Path(pptx_designer.__file__).parts;
          print(metadata.version('pptx-designer'), pptx_designer.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
