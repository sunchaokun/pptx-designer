name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/pptx-designer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: >-
          python -c "import importlib.metadata as metadata, pathlib, pptx_designer;
          assert metadata.version('pptx-designer') == '1.0.0b9';
          assert 'site-packages' in pathlib.Path(pptx_designer.__file__).parts;
          print(metadata.version('pptx-designer'), pptx_designer.__file__)"
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
