[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-designer"
version = "1.0.0b5"
description = "Python library for LLMs to generate pixel-perfect PowerPoint presentations with 40,000+ style combinations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Chaokun Sun", email = "sunchaokun@gmail.com"},
]
keywords = [
    "pptx", "powerpoint", "presentation", "llm", "ai",
    "build-mode", "svg", "charts", "diagrams", "python-pptx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Typing :: Typed",
]
dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=4.9.0",
    "Pillow>=10.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
images = [
    "httpx>=0.24.0",
]
ai-images = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
pptx-designer = "pptx_designer.cli.main:main"

[project.urls]
Homepage = "https://github.com/sunchaokun/pptx-designer"
Documentation = "https://github.com/sunchaokun/pptx-designer/tree/main/docs"
Repository = "https://github.com/sunchaokun/pptx-designer"
Changelog = "https://github.com/sunchaokun/pptx-designer/blob/main/CHANGELOG.md"
Issues = "https://github.com/sunchaokun/pptx-designer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pptx_designer = ["data/*.csv", "data/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# `C` is the documented palette context argument in the build API.  The
# affected legacy modules also use OOXML element abbreviations (for example,
# `spPr`) that mirror the underlying presentation schema.  Scope these
# compatibility exceptions to existing files; new modules remain checked.
[tool.ruff.lint.per-file-ignores]
"src/pptx_designer/compiler/_paint.py" = ["N803"]
"src/pptx_designer/compiler/_path.py" = ["N806"]
"src/pptx_designer/compiler/_text.py" = ["N803"]
"src/pptx_designer/compiler/_theme.py" = ["N803", "N806"]
"src/pptx_designer/core/decider.py" = ["N806"]
"src/pptx_designer/core/pipeline.py" = ["N802", "N803", "N806"]
"src/pptx_designer/core/professional_renderer.py" = ["N803"]
"src/pptx_designer/effects/animation.py" = ["N806"]
"src/pptx_designer/effects/image_effects.py" = ["N803", "N806"]
"src/pptx_designer/effects/shape_effects.py" = ["N803", "N806"]
"src/pptx_designer/effects/text_effects.py" = ["N803", "N806"]
"src/pptx_designer/renderer/boolean_shapes.py" = ["N803", "N806"]
"src/pptx_designer/renderer/freeform_builder.py" = ["N806"]
"src/pptx_designer/renderer/precision.py" = ["N806"]
"src/pptx_designer/renderer/shape_utils.py" = ["N806"]
"src/pptx_designer/renderer/shapes.py" = ["N806"]
"src/pptx_designer/renderer/theme.py" = ["N806"]
"src/pptx_designer/tools/cards.py" = ["N803", "N806"]
"src/pptx_designer/tools/charts.py" = ["N803", "N806"]
"src/pptx_designer/tools/images.py" = ["N806"]
"src/pptx_designer/tools/layout.py" = ["N803", "N806"]
"src/pptx_designer/tools/shapes.py" = ["N803", "N806"]
"src/pptx_designer/tools/svg.py" = ["N803"]
"src/pptx_designer/tools/text.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
